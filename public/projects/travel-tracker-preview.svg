<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Travel Tracker product artwork</title>
  <desc id="desc">A dark travel passport interface with a route, map pins, progress, and trip memories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="70" fill="url(#bg)"/>
  <path d="M-40 760 C250 590 360 760 635 610 S1110 390 1650 470" fill="none" stroke="#5eead4" stroke-opacity=".18" stroke-width="3" stroke-dasharray="12 16"/>
  <g fill="#fff" opacity=".08">
    <circle cx="1340" cy="150" r="250"/><circle cx="245" cy="870" r="320"/>
  </g>

  <g transform="translate(120 125)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#99f6e4" letter-spacing="4">TRAVEL TRACKER</text>
    <text x="0" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="78" font-weight="750" fill="#ffffff">Explore.</text>
    <text x="0" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="78" font-weight="750" fill="#ffffff">Track. Remember.</text>
    <text x="0" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" fill="#cbd5e1">Your trips become a visual passport.</text>
  </g>

  <g transform="translate(875 105)" filter="url(#shadow)">
    <rect width="545" height="730" rx="58" fill="#0b1224" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="30" y="30" width="485" height="670" rx="42" fill="url(#card)" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="65" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" fill="#99f6e4">YOUR PASSPORT</text>
    <text x="65" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#fff">18 countries</text>
    <text x="65" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#94a3b8">12% of the world explored</text>
    <rect x="65" y="215" width="415" height="230" rx="28" fill="#0f1d38"/>
    <g fill="#334155" stroke="#64748b" stroke-width="2" opacity=".85">
      <path d="M110 320c34-64 75-79 111-56 32 20 50 4 76-25 25-29 61-31 83-11 36 33 31 83-8 111-27 20-55 31-75 60-27 39-67 38-97 17-23-16-44-16-71-4-34 15-59-4-55-34 3-25 22-38 36-58z"/>
      <path d="M350 287c44-38 95-24 113 15 15 34 0 65-28 83-24 16-49 22-70 47-23 27-58 21-69-10-10-28 8-44 24-60 20-21 19-51 30-75z"/>
    </g>
    <g fill="#5eead4">
      <circle cx="186" cy="309" r="11"/><circle cx="303" cy="273" r="11"/><circle cx="400" cy="339" r="11"/>
    </g>
    <path d="M186 309 C235 250 255 316 303 273 S358 282 400 339" fill="none" stroke="#5eead4" stroke-width="4" stroke-dasharray="9 10"/>
    <text x="65" y="493" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="650" fill="#cbd5e1">RECENT TRIP</text>
    <rect x="65" y="520" width="415" height="130" rx="25" fill="#ffffff" fill-opacity=".07"/>
    <circle cx="113" cy="565" r="24" fill="#fbbf24"/>
    <text x="155" y="566" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="650" fill="#fff">Italy</text>
    <text x="155" y="597" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#94a3b8">Rome · Florence · Venice</text>
    <text x="155" y="625" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#5eead4">7 places · 24 photos</text>
  </g>

  <g transform="translate(150 520)">
    <rect width="570" height="245" rx="42" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".10"/>
    <text x="40" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="650" fill="#99f6e4">TRIP MEMORY</text>
    <text x="40" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="32" font-weight="650" fill="#fff">New York, 2026</text>
    <text x="40" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#cbd5e1">Friends, notes, dates, photos, and</text>
    <text x="40" y="181" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" fill="#cbd5e1">the places that made the trip yours.</text>
    <rect x="40" y="204" width="170" height="5" rx="3" fill="#5eead4"/>
  </g>
</svg>
