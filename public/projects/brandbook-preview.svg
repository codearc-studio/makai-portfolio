<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">BrandBook macOS product concept</title>
  <desc id="desc">A conceptual BrandBook workspace with brand navigation, logos, colors, typography and assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75a7ff"/><stop offset="1" stop-color="#b68cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="70" fill="url(#bg)"/>
  <circle cx="1350" cy="150" r="350" fill="#675cff" opacity=".13"/>
  <circle cx="250" cy="900" r="360" fill="#27a9ff" opacity=".09"/>

  <g transform="translate(115 115)" filter="url(#shadow)">
    <rect width="1370" height="770" rx="46" fill="#121212" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="0" y="0" width="1370" height="64" rx="46" fill="#ffffff" fill-opacity=".035"/>
    <circle cx="34" cy="32" r="7" fill="#ff605c"/><circle cx="58" cy="32" r="7" fill="#ffbd44"/><circle cx="82" cy="32" r="7" fill="#00ca4e"/>
    <text x="126" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" fill="#f5f5f5">BrandBook</text>
    <rect x="1130" y="17" width="190" height="32" rx="16" fill="#fff" fill-opacity=".08"/>
    <text x="1151" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#a3a3a3">Search brands…</text>

    <rect x="0" y="64" width="250" height="706" fill="#ffffff" fill-opacity=".025"/>
    <text x="28" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#777" letter-spacing="2">CODEARC</text>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#a3a3a3">
      <rect x="18" y="133" width="214" height="42" rx="12" fill="#ffffff" fill-opacity=".09"/>
      <text x="42" y="160" fill="#fff" font-weight="600">Overview</text>
      <text x="42" y="211">Guidelines</text><text x="42" y="253">Assets</text><text x="42" y="295">Logos</text><text x="42" y="337">Colors</text><text x="42" y="379">Typography</text><text x="42" y="421">Images</text><text x="42" y="463">Resources</text>
    </g>
    <rect x="25" y="641" width="200" height="96" rx="20" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/>
    <text x="45" y="675" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" fill="#888">PORTABLE BRAND</text>
    <text x="45" y="706" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="650" fill="#fff">CodeArc.brandbook</text>

    <g transform="translate(298 112)">
      <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="650" fill="#8a8a8a">BRAND OVERVIEW</text>
      <text x="0" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="52" font-weight="700" fill="#fff">CodeArc.studio</text>
      <text x="0" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" fill="#949494">Everything the brand needs, in one place.</text>

      <g transform="translate(0 150)">
        <rect width="280" height="195" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/>
        <path d="M72 114a52 52 0 1 1 0-74" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
        <path d="M75 42l30 31-30 31" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="650" fill="#fff">Primary logo</text>
      </g>

      <g transform="translate(306 150)">
        <rect width="310" height="195" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/>
        <text x="28" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#888">COLORS</text>
        <circle cx="62" cy="102" r="28" fill="#2d8cff"/><circle cx="128" cy="102" r="28" fill="#0f1020"/><circle cx="194" cy="102" r="28" fill="#f5f7fa"/><circle cx="260" cy="102" r="28" fill="#ffc233"/>
        <text x="28" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="650" fill="#fff">Brand palette</text>
      </g>

      <g transform="translate(642 150)">
        <rect width="370" height="195" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/>
        <text x="28" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#888">TYPOGRAPHY</text>
        <text x="28" y="107" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#fff">Aa Bb Cc</text>
        <text x="28" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" fill="#aaa">Headings · Body · Captions</text>
      </g>

      <g transform="translate(0 375)">
        <rect width="1012" height="200" rx="30" fill="url(#glass)" stroke="#fff" stroke-opacity=".09"/>
        <text x="28" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#888">RECENT ASSETS</text>
        <g transform="translate(28 72)">
          <rect width="205" height="98" rx="18" fill="#f5f7fa"/><rect x="225" width="205" height="98" rx="18" fill="#2d8cff"/><rect x="450" width="205" height="98" rx="18" fill="#14151c"/><rect x="675" width="280" height="98" rx="18" fill="#fff" fill-opacity=".06"/>
          <text x="715" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="650" fill="#fff">+ Add asset</text>
        </g>
      </g>
    </g>
  </g>
</svg>
